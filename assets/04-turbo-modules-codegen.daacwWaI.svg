<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#EAFBF1"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#2D2A32" stroke-width="4"/>

  <!-- 标题 -->
  <rect x="60" y="40" width="700" height="70" rx="16" fill="#2D2A32"/>
  <text x="86" y="72" font-size="28" font-weight="bold" fill="#6BCB77">第四幕 · TurboModules 与 Codegen</text>
  <text x="86" y="98" font-size="17" fill="#FFFFFF">流水线：SPEC 规格书 → 解析成 Schema → 缝出三套类型化制服</text>

  <!-- 流水线主体 -->
  <!-- 站点1：SPEC -->
  <g transform="translate(70,170)">
    <rect x="0" y="0" width="250" height="180" rx="16" fill="#FFFFFF" stroke="#2D2A32" stroke-width="4"/>
    <text x="125" y="36" font-size="19" font-weight="bold" text-anchor="middle" fill="#2D2A32">① 写 SPEC 规格书</text>
    <text x="125" y="64" font-size="14" text-anchor="middle" fill="#2D2A32">TS / Flow 声明文件</text>
    <text x="125" y="88" font-size="14" text-anchor="middle" fill="#2D2A32">方法签名 + 类型标注</text>
    <rect x="24" y="106" width="202" height="52" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2.5"/>
    <text x="125" y="128" font-size="12.5" text-anchor="middle" fill="#2D2A32">getTemperature(city: string):</text>
    <text x="125" y="146" font-size="12.5" text-anchor="middle" fill="#2D2A32">Promise&lt;number&gt;</text>
  </g>
  <path d="M 330 260 L 376 260" stroke="#2D2A32" stroke-width="5"/>
  <path d="M 366 250 L 380 260 L 366 270 Z" fill="#2D2A32"/>

  <!-- 站点2：codegen 解析 -->
  <g transform="translate(384,170)">
    <rect x="0" y="0" width="250" height="180" rx="16" fill="#FFD93D" stroke="#2D2A32" stroke-width="4"/>
    <text x="125" y="36" font-size="19" font-weight="bold" text-anchor="middle" fill="#2D2A32">② Codegen 解析</text>
    <text x="125" y="64" font-size="14" text-anchor="middle" fill="#2D2A32">@react-native/codegen 0.87.1</text>
    <text x="125" y="88" font-size="14" text-anchor="middle" fill="#2D2A32">hermes-parser 读声明</text>
    <rect x="24" y="106" width="202" height="52" rx="8" fill="#FFFFFF" stroke="#2D2A32" stroke-width="2.5"/>
    <text x="125" y="128" font-size="12.5" text-anchor="middle" fill="#2D2A32">产出统一 Schema JSON</text>
    <text x="125" y="146" font-size="12.5" text-anchor="middle" fill="#2D2A32">（唯一事实来源）</text>
  </g>
  <path d="M 644 260 L 690 260" stroke="#2D2A32" stroke-width="5"/>
  <path d="M 680 250 L 694 260 L 680 270 Z" fill="#2D2A32"/>

  <!-- 站点3：三套生成物 -->
  <g transform="translate(698,150)">
    <rect x="0" y="0" width="430" height="220" rx="16" fill="#FFFFFF" stroke="#2D2A32" stroke-width="4"/>
    <text x="215" y="36" font-size="19" font-weight="bold" text-anchor="middle" fill="#2D2A32">③ 缝出三套"类型化制服"</text>
    <g font-size="14" fill="#2D2A32">
      <rect x="24" y="56" width="180" height="64" rx="10" fill="#61DAFB" stroke="#2D2A32" stroke-width="3"/>
      <text x="114" y="82" text-anchor="middle" font-weight="bold">C++ 桩</text>
      <text x="114" y="104" text-anchor="middle" font-size="12.5">__hostFunction_*</text>
      <rect x="226" y="56" width="180" height="64" rx="10" fill="#6BCB77" stroke="#2D2A32" stroke-width="3"/>
      <text x="316" y="82" text-anchor="middle" font-weight="bold">ObjC 协议</text>
      <text x="316" y="104" text-anchor="middle" font-size="12.5">SPEC 协议头文件</text>
      <rect x="24" y="136" width="180" height="64" rx="10" fill="#FF9F45" stroke="#2D2A32" stroke-width="3"/>
      <text x="114" y="162" text-anchor="middle" font-weight="bold">Java 接口</text>
      <text x="114" y="184" text-anchor="middle" font-size="12.5">NativeXxxSpec</text>
      <rect x="226" y="136" width="180" height="64" rx="10" fill="#C8B6FF" stroke="#2D2A32" stroke-width="3"/>
      <text x="316" y="162" text-anchor="middle" font-weight="bold">JS/TS 类型</text>
      <text x="316" y="184" text-anchor="middle" font-size="12.5">import 后自动补全</text>
    </g>
  </g>

  <!-- 底部：调用链 -->
  <g transform="translate(70,410)">
    <rect x="0" y="0" width="1060" height="200" rx="16" fill="#2D2A32"/>
    <text x="530" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFD93D">一次 TurboModule 调用的完整链路（0.87.1 实测源码）</text>
    <g font-size="15">
      <rect x="30" y="66" width="190" height="60" rx="10" fill="#FFFFFF"/>
      <text x="125" y="92" text-anchor="middle" fill="#2D2A32" font-weight="bold">JS 调用方法</text>
      <text x="125" y="114" text-anchor="middle" fill="#2D2A32" font-size="13">类型检查 ✓</text>
      <rect x="260" y="66" width="190" height="60" rx="10" fill="#61DAFB"/>
      <text x="355" y="92" text-anchor="middle" fill="#2D2A32" font-weight="bold">__turboModuleProxy</text>
      <text x="355" y="114" text-anchor="middle" fill="#2D2A32" font-size="13">HostObject 同步直达</text>
      <rect x="490" y="66" width="190" height="60" rx="10" fill="#C8B6FF"/>
      <text x="585" y="92" text-anchor="middle" fill="#2D2A32" font-weight="bold">生成桩 __hostFunction_*</text>
      <text x="585" y="114" text-anchor="middle" fill="#2D2A32" font-size="13">C++ 分发</text>
      <rect x="720" y="66" width="150" height="60" rx="10" fill="#FF9F45"/>
      <text x="795" y="92" text-anchor="middle" fill="#2D2A32" font-weight="bold">invokeJavaMethod</text>
      <text x="795" y="114" text-anchor="middle" fill="#2D2A32" font-size="13">JNI / ObjC</text>
      <rect x="900" y="66" width="130" height="60" rx="10" fill="#6BCB77"/>
      <text x="965" y="92" text-anchor="middle" fill="#2D2A32" font-weight="bold">原生实现</text>
      <text x="965" y="114" text-anchor="middle" fill="#2D2A32" font-size="13">干活 ✓</text>
    </g>
    <path d="M 226 96 L 252 96 M 456 96 L 482 96 M 686 96 L 712 96 M 876 96 L 894 96" stroke="#FFD93D" stroke-width="4"/>
    <text x="530" y="170" text-anchor="middle" font-size="14" fill="#FFFFFF">Android 侧管理器：TurboModuleManager.kt —— 模块懒创建（ModuleHolder），首次调用才实例化</text>
  </g>

  <!-- 懒创建气泡 -->
  <g transform="translate(70,636)">
    <rect x="0" y="0" width="1060" height="70" rx="14" fill="#FFF9EC" stroke="#2D2A32" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="530" y="30" font-size="15.5" text-anchor="middle" fill="#2D2A32">性能彩蛋：启动时一个 TurboModule 都不创建 —— 全部"首次使用才实例化"（ModuleHolder.kt:L22-L30）</text>
    <text x="530" y="54" font-size="15.5" text-anchor="middle" fill="#2D2A32">对比旧架构"启动即全量初始化 100+ 模块"，这是新架构启动更快的第二个秘密</text>
  </g>
</svg>
