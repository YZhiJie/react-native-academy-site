<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#FFF4E6"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#2D2A32" stroke-width="4"/>

  <!-- 标题 -->
  <rect x="60" y="40" width="640" height="70" rx="16" fill="#2D2A32"/>
  <text x="86" y="72" font-size="28" font-weight="bold" fill="#FFD93D">第二幕 · 启动大戏</text>
  <text x="86" y="98" font-size="17" fill="#FFFFFF">从点开图标到第一帧：双端双泳道 + JS 中央舞台</text>

  <!-- 中央 JS 泳道 -->
  <rect x="380" y="150" width="440" height="500" rx="20" fill="#61DAFB" stroke="#2D2A32" stroke-width="4"/>
  <text x="600" y="186" font-size="22" font-weight="bold" text-anchor="middle" fill="#2D2A32">JS 中央舞台</text>
  <g font-size="15" fill="#2D2A32">
    <rect x="410" y="210" width="380" height="76" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
    <text x="430" y="240">③ 加载 JS bundle（Hermes 字节码）</text>
    <text x="430" y="266" font-size="13">metro-runtime 负责模块加载</text>
    <rect x="410" y="306" width="380" height="76" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
    <text x="430" y="336">④ setup-env 搭建 JS 环境</text>
    <text x="430" y="362" font-size="13">timer/console/错误堆栈（src/setup-env.js）</text>
    <rect x="410" y="402" width="380" height="76" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
    <text x="430" y="432">⑤ AppRegistry.registerComponent</text>
    <text x="430" y="458" font-size="13">你的 App 组件登记造册（AppRegistryImpl.js）</text>
    <rect x="410" y="498" width="380" height="76" rx="12" fill="#FFD93D" stroke="#2D2A32" stroke-width="3"/>
    <text x="430" y="528">⑥ 原生回调 runApplication(appKey)</text>
    <text x="430" y="554" font-size="13">开演！React 开始渲染</text>
    <rect x="410" y="574" width="380" height="76" rx="12" fill="#6BCB77" stroke="#2D2A32" stroke-width="3"/>
    <text x="430" y="604">⑦ ReactFabric → C++ Fabric → mount 指令</text>
    <text x="430" y="630" font-size="13">影子树 commit，原生视图上屏</text>
  </g>

  <!-- iOS 泳道 -->
  <g>
    <rect x="60" y="150" width="280" height="500" rx="20" fill="#FF9F45" stroke="#2D2A32" stroke-width="4"/>
    <text x="200" y="186" font-size="21" font-weight="bold" text-anchor="middle" fill="#2D2A32">iOS 泳道</text>
    <g font-size="14" fill="#2D2A32">
      <rect x="84" y="216" width="232" height="92" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <text x="100" y="246">① main() → RCTAppDelegate</text>
      <text x="100" y="268" font-size="12.5">didFinishLaunching：</text>
      <text x="100" y="290" font-size="12.5">创建 RCTRootViewFactory</text>
      <rect x="84" y="330" width="232" height="92" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <text x="100" y="360">② bridgeless 建运行时</text>
      <text x="100" y="382" font-size="12.5">RCTBundleManager 提供</text>
      <text x="100" y="402" font-size="12.5">bundle 地址（dev/发布两条路）</text>
      <rect x="84" y="444" width="232" height="92" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <text x="100" y="474">Hermes 引擎就位</text>
      <text x="100" y="496" font-size="12.5">scripts/cocoapods/jsengine.rb</text>
      <text x="100" y="518" font-size="12.5">把 hermes-engine pod 接上</text>
      <rect x="84" y="558" width="232" height="92" rx="12" fill="#FFF9EC" stroke="#2D2A32" stroke-width="3" stroke-dasharray="7 5"/>
      <text x="100" y="588" font-size="12.5">※ 旧 RCTBridge 已标 deprecated</text>
      <text x="100" y="610" font-size="12.5">（React/Base/RCTBridge.h:L96）</text>
      <text x="100" y="632" font-size="12.5">新剧只走 bridgeless 通道</text>
    </g>
  </g>

  <!-- Android 泳道 -->
  <g>
    <rect x="860" y="150" width="280" height="500" rx="20" fill="#6BCB77" stroke="#2D2A32" stroke-width="4"/>
    <text x="1000" y="186" font-size="21" font-weight="bold" text-anchor="middle" fill="#2D2A32">Android 泳道</text>
    <g font-size="14" fill="#2D2A32">
      <rect x="884" y="216" width="232" height="92" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <text x="900" y="246">① ReactActivity 启动</text>
      <text x="900" y="268" font-size="12.5">委托 ReactActivityDelegate</text>
      <text x="900" y="290" font-size="12.5">getMainComponentName() 报名</text>
      <rect x="884" y="330" width="232" height="92" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <text x="900" y="360">② ReactHostImpl.start()</text>
      <text x="900" y="382" font-size="12.5">后台线程预初始化 ReactInstance</text>
      <text x="900" y="402" font-size="12.5">（ReactHostImpl.kt:L181）</text>
      <rect x="884" y="444" width="232" height="92" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <text x="900" y="474">③ startSurface(surface)</text>
      <text x="900" y="496" font-size="12.5">附加渲染面，等待 JS 就绪</text>
      <text x="900" y="518" font-size="12.5">（ReactHostImpl.kt:L201-L210）</text>
      <rect x="884" y="558" width="232" height="92" rx="12" fill="#FFF9EC" stroke="#2D2A32" stroke-width="3" stroke-dasharray="7 5"/>
      <text x="900" y="588" font-size="12.5">※ 旧路径 ReactRootView.</text>
      <text x="900" y="610" font-size="12.5">runApplication() → AppRegistry</text>
      <text x="900" y="632" font-size="12.5">（LegacyReactRootView 时代记忆）</text>
    </g>
  </g>

  <!-- 首帧横幅 -->
  <g transform="translate(380,664)">
    <rect x="0" y="0" width="440" height="56" rx="14" fill="#FF6B9D" stroke="#2D2A32" stroke-width="4"/>
    <text x="220" y="36" font-size="21" font-weight="bold" text-anchor="middle" fill="#FFFFFF">🎉 ⑧ 第一帧上屏！启动完成</text>
  </g>

  <!-- 汇聚箭头 -->
  <path d="M 340 430 C 360 430, 366 430, 376 430" stroke="#2D2A32" stroke-width="4" fill="none"/>
  <path d="M 860 430 C 840 430, 836 430, 824 430" stroke="#2D2A32" stroke-width="4" fill="none"/>

  <!-- 底部注 -->
  <text x="600" y="760" font-size="15" text-anchor="middle" fill="#2D2A32">两条泳道殊途同归：都把"该演哪出戏"（appKey + 初始 props）交给 JS 中央舞台，由 AppRegistry.runApplication 开演</text>
</svg>
