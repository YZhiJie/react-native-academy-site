<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#F0F0FB"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#2D2A32" stroke-width="4"/>

  <!-- 标题 -->
  <rect x="60" y="40" width="680" height="70" rx="16" fill="#2D2A32"/>
  <text x="86" y="72" font-size="28" font-weight="bold" fill="#C8B6FF">第八幕 · iOS 内幕</text>
  <text x="86" y="98" font-size="17" fill="#FFFFFF">CocoaPods 交响乐团 → 乐团编制 → bridgeless 指挥棒 → SwiftUI 新客</text>

  <!-- 左上：pod 乐团 -->
  <g transform="translate(60,150)">
    <rect x="0" y="0" width="640" height="240" rx="16" fill="#FFFFFF" stroke="#2D2A32" stroke-width="4"/>
    <text x="320" y="38" font-size="19" font-weight="bold" text-anchor="middle" fill="#2D2A32">① pod install：指挥家点名，乐团成军</text>
    <!-- 指挥家 -->
    <g transform="translate(80,120)">
      <circle cx="0" cy="0" r="26" fill="#FFF9EC" stroke="#2D2A32" stroke-width="3"/>
      <circle cx="-8" cy="-2" r="2.5" fill="#2D2A32"/><circle cx="8" cy="-2" r="2.5" fill="#2D2A32"/>
      <path d="M -8 10 Q 0 15 8 10" stroke="#2D2A32" stroke-width="2.5" fill="none"/>
      <path d="M 24 -18 L 46 -40" stroke="#2D2A32" stroke-width="4"/>
      <circle cx="50" cy="-44" r="5" fill="#FF6B9D"/>
      <text x="0" y="48" font-size="13" text-anchor="middle" fill="#2D2A32">Podfile.rb</text>
    </g>
    <!-- 乐手 -->
    <g font-size="13.5" text-anchor="middle">
      <rect x="200" y="84" width="120" height="40" rx="10" fill="#61DAFB"/><text x="260" y="109" fill="#2D2A32">React</text>
      <rect x="200" y="136" width="120" height="40" rx="10" fill="#FFD93D"/><text x="260" y="161" fill="#2D2A32">React-Core</text>
      <rect x="340" y="84" width="130" height="40" rx="10" fill="#6BCB77"/><text x="405" y="109" fill="#2D2A32">React-RuntimeApple</text>
      <rect x="340" y="136" width="130" height="40" rx="10" fill="#FF9F45"/><text x="405" y="161" fill="#2D2A32">React-RCTFabric</text>
      <rect x="490" y="84" width="130" height="40" rx="10" fill="#C8B6FF"/><text x="555" y="109" fill="#2D2A32">React-hermes</text>
      <rect x="490" y="136" width="130" height="40" rx="10" fill="#FF6B9D"/><text x="555" y="161" fill="#FFF9EC">hermes-engine</text>
    </g>
    <text x="320" y="212" text-anchor="middle" font-size="13" fill="#2D2A32">jsengine.rb 的 setup_hermes!（scripts/cocoapods/jsengine.rb:L8-20）一锤定音：JS 引擎 = Hermes</text>
  </g>

  <!-- 右上：React-RuntimeApple 编制 -->
  <g transform="translate(730,150)">
    <rect x="0" y="0" width="410" height="240" rx="16" fill="#C8B6FF" stroke="#2D2A32" stroke-width="4"/>
    <text x="205" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#2D2A32">② RuntimeApple 的四件套编制</text>
    <g font-size="14" text-anchor="middle">
      <rect x="40" y="66" width="330" height="34" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2"/>
      <text x="205" y="88" fill="#2D2A32">React-CoreModules（核心模块组）</text>
      <rect x="40" y="108" width="330" height="34" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2"/>
      <text x="205" y="130" fill="#2D2A32">React-RCTFabric（Fabric 视图组件）</text>
      <rect x="40" y="150" width="330" height="34" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2"/>
      <text x="205" y="172" fill="#2D2A32">React-NativeModulesApple（原生模块）</text>
      <rect x="40" y="192" width="330" height="34" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2"/>
      <text x="205" y="214" fill="#2D2A32">React-runtimeexecutor（JS 运行时执行器）</text>
    </g>
  </g>

  <!-- 左下：bridgeless -->
  <g transform="translate(60,430)">
    <rect x="0" y="0" width="640" height="290" rx="16" fill="#FFD93D" stroke="#2D2A32" stroke-width="4"/>
    <text x="320" y="42" font-size="19" font-weight="bold" text-anchor="middle" fill="#2D2A32">③ 指挥棒换新：bridgeless 默认</text>
    <!-- 旧 vs 新 -->
    <g transform="translate(50,80)">
      <rect x="0" y="0" width="250" height="150" rx="12" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2.5"/>
      <text x="125" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#2D2A32">旧：RCTBridge 大管家</text>
      <text x="125" y="58" font-size="13" text-anchor="middle" fill="#2D2A32">RCTBridge.h:L96-124</text>
      <text x="125" y="80" font-size="13" text-anchor="middle" fill="#2D2A32">构造 API 已标 deprecated</text>
      <text x="125" y="102" font-size="13" text-anchor="middle" fill="#2D2A32">"随 legacy architecture 移除"</text>
      <text x="125" y="132" font-size="12.5" text-anchor="middle" fill="#2D2A32">代码还在，门牌已摘</text>
    </g>
    <path d="M 310 155 L 340 155" stroke="#2D2A32" stroke-width="5"/>
    <path d="M 330 145 L 344 155 L 330 165 Z" fill="#2D2A32"/>
    <g transform="translate(350,80)">
      <rect x="0" y="0" width="240" height="150" rx="12" fill="#6BCB77" stroke="#2D2A32" stroke-width="2.5"/>
      <text x="120" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#2D2A32">新：ReactHost 直管</text>
      <text x="120" y="58" font-size="13" text-anchor="middle" fill="#2D2A32">RCTBundleManager.m:L103-167</text>
      <text x="120" y="80" font-size="13" text-anchor="middle" fill="#2D2A32">bridgeless 开关 getter/setter</text>
      <text x="120" y="102" font-size="13" text-anchor="middle" fill="#2D2A32">bundle 地址注册 L81-99</text>
      <text x="120" y="132" font-size="12.5" text-anchor="middle" fill="#2D2A32">0.87 新项目默认就走它</text>
    </g>
    <text x="320" y="268" text-anchor="middle" font-size="13" fill="#2D2A32">台词（旧桥）："我不是退休，只是站到了侧幕。"</text>
  </g>

  <!-- 右下：SwiftUI 新客 -->
  <g transform="translate(730,430)">
    <rect x="0" y="0" width="410" height="290" rx="16" fill="#FF6B9D" stroke="#2D2A32" stroke-width="4"/>
    <text x="205" y="42" font-size="19" font-weight="bold" text-anchor="middle" fill="#2D2A32">④ 新客入团：ReactApple / RCTSwiftUI</text>
    <!-- 新人形象 -->
    <g transform="translate(150,80)">
      <circle cx="0" cy="0" r="24" fill="#FFF9EC" stroke="#2D2A32" stroke-width="3"/>
      <circle cx="-7" cy="-2" r="2.5" fill="#2D2A32"/><circle cx="7" cy="-2" r="2.5" fill="#2D2A32"/>
      <path d="M -7 9 Q 0 13 7 9" stroke="#2D2A32" stroke-width="2.5" fill="none"/>
      <path d="M -24 44 L -22 30 Q 0 22 22 30 L 24 44 Z" fill="#2D2A32"/>
      <rect x="34" y="-24" width="120" height="24" rx="8" fill="#FFFFFF" stroke="#2D2A32" stroke-width="2"/>
      <text x="94" y="-7" font-size="12" text-anchor="middle" fill="#2D2A32">新来的，多关照！</text>
    </g>
    <text x="205" y="172" font-size="13.5" text-anchor="middle" fill="#2D2A32">RCTSwiftUIContainerView.swift：Swift 声明式容器</text>
    <text x="205" y="196" font-size="13.5" text-anchor="middle" fill="#2D2A32">RCTSwiftUIContainerViewWrapper.m：ObjC 包装对接 Fabric</text>
    <text x="205" y="224" font-size="13" text-anchor="middle" fill="#2D2A32">滤镜全家桶：blur / grayscale / shadow / saturation</text>
    <text x="205" y="246" font-size="13" text-anchor="middle" fill="#2D2A32">/ contrast / hueRotation</text>
    <text x="205" y="272" font-size="12.5" text-anchor="middle" fill="#2D2A32">旧视图 React/Views/RCTView.m ↔ 新视图 Fabric/ComponentViews/RCTViewComponentView.mm</text>
  </g>

  <!-- 底注 -->
  <text x="600" y="762" font-size="15" text-anchor="middle" fill="#2D2A32">一句话：iOS 侧 = 一场 pod 交响乐 + 一根 bridgeless 指挥棒 + 一位 SwiftUI 新客</text>
</svg>
