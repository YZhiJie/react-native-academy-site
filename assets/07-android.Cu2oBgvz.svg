<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#EFF7EE"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#2D2A32" stroke-width="4"/>

  <!-- 标题 -->
  <rect x="60" y="40" width="640" height="70" rx="16" fill="#2D2A32"/>
  <text x="86" y="72" font-size="28" font-weight="bold" fill="#6BCB77">第七幕 · Android 内幕</text>
  <text x="86" y="98" font-size="17" fill="#FFFFFF">Kotlin 工厂开工 → 组件登记处 → JNI 地道 → 预制件出厂</text>

  <!-- 站点1：ReactActivity -->
  <g transform="translate(60,150)">
    <rect x="0" y="0" width="330" height="170" rx="16" fill="#61DAFB" stroke="#2D2A32" stroke-width="4"/>
    <text x="165" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#2D2A32">① 大门：ReactActivity</text>
    <text x="165" y="66" font-size="13.5" text-anchor="middle" fill="#2D2A32">继承 AppCompatActivity，</text>
    <text x="165" y="88" font-size="13.5" text-anchor="middle" fill="#2D2A32">把生命周期转交给 Delegate</text>
    <rect x="35" y="104" width="260" height="32" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2"/>
    <text x="165" y="125" font-size="12.5" text-anchor="middle" fill="#2D2A32">ReactActivity.java:L23-65</text>
    <text x="165" y="156" font-size="13" text-anchor="middle" fill="#2D2A32">台词："我只管开门，里面的事 Delegate 管。"</text>
  </g>
  <path d="M 394 235 L 432 235" stroke="#2D2A32" stroke-width="5"/>
  <path d="M 422 225 L 436 235 L 422 245 Z" fill="#2D2A32"/>

  <!-- 站点2：ReactHostImpl -->
  <g transform="translate(440,150)">
    <rect x="0" y="0" width="330" height="170" rx="16" fill="#FFD93D" stroke="#2D2A32" stroke-width="4"/>
    <text x="165" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#2D2A32">② 新链总管：ReactHostImpl</text>
    <text x="165" y="66" font-size="13.5" text-anchor="middle" fill="#2D2A32">start() 提前到 Application 阶段</text>
    <text x="165" y="88" font-size="13.5" text-anchor="middle" fill="#2D2A32">后台预初始化 JS 引擎</text>
    <rect x="35" y="104" width="260" height="32" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2"/>
    <text x="165" y="125" font-size="12.5" text-anchor="middle" fill="#2D2A32">ReactHostImpl.kt:L86-107 · start L181 · surface L201</text>
    <text x="165" y="156" font-size="13" text-anchor="middle" fill="#2D2A32">旧链 ReactNativeHost.kt:L30-120 仍在，但已谢幕</text>
  </g>
  <path d="M 774 235 L 812 235" stroke="#2D2A32" stroke-width="5"/>
  <path d="M 802 225 L 816 235 L 802 245 Z" fill="#2D2A32"/>

  <!-- 站点3：ComponentFactory -->
  <g transform="translate(820,150)">
    <rect x="0" y="0" width="320" height="170" rx="16" fill="#FF9F45" stroke="#2D2A32" stroke-width="4"/>
    <text x="160" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#2D2A32">③ 工厂：ComponentFactory</text>
    <text x="160" y="66" font-size="13.5" text-anchor="middle" fill="#2D2A32">把 JS 组件名 → 平台视图实现</text>
    <text x="160" y="88" font-size="13.5" text-anchor="middle" fill="#2D2A32">逐一装配进注册表</text>
    <rect x="35" y="104" width="250" height="32" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2"/>
    <text x="160" y="125" font-size="12.5" text-anchor="middle" fill="#2D2A32">ComponentFactory.kt:L13-24</text>
    <text x="160" y="156" font-size="13" text-anchor="middle" fill="#2D2A32">台词："名字对得上，活我包了。"</text>
  </g>

  <!-- 中部：组件登记处 -->
  <g transform="translate(60,360)">
    <rect x="0" y="0" width="1080" height="150" rx="16" fill="#2D2A32"/>
    <text x="540" y="36" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFD93D">④ 核心组件登记处（C++ 直注册，不经反射）</text>
    <g font-size="14" font-weight="bold">
      <rect x="60" y="62" width="130" height="50" rx="10" fill="#6BCB77"/><text x="125" y="92" text-anchor="middle" fill="#2D2A32">View</text>
      <rect x="215" y="62" width="130" height="50" rx="10" fill="#61DAFB"/><text x="280" y="92" text-anchor="middle" fill="#2D2A32">Image</text>
      <rect x="370" y="62" width="130" height="50" rx="10" fill="#FFD93D"/><text x="435" y="92" text-anchor="middle" fill="#2D2A32">Text</text>
      <rect x="525" y="62" width="150" height="50" rx="10" fill="#FF9F45"/><text x="600" y="92" text-anchor="middle" fill="#2D2A32">ScrollView</text>
      <rect x="700" y="62" width="130" height="50" rx="10" fill="#C8B6FF"/><text x="765" y="92" text-anchor="middle" fill="#2D2A32">Modal</text>
      <rect x="855" y="62" width="165" height="50" rx="10" fill="#FF6B9D"/><text x="937" y="92" text-anchor="middle" fill="#FFF9EC">TextInput/Switch</text>
    </g>
    <text x="540" y="136" text-anchor="middle" font-size="13.5" fill="#FFFFFF">CoreComponentsRegistry.cpp:L38-90 —— 编译期就绑死，比启动时反射扫描快一个量级</text>
  </g>

  <!-- 底部：JNI + prefab -->
  <g transform="translate(60,550)">
    <rect x="0" y="0" width="520" height="160" rx="16" fill="#9B5DE5" stroke="#2D2A32" stroke-width="4"/>
    <text x="260" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">⑤ JNI 地道：JSI ↔ Java</text>
    <text x="260" y="70" font-size="14" text-anchor="middle" fill="#FFFFFF">TurboModuleManager 在启动时安装 JSI bindings</text>
    <text x="260" y="94" font-size="14" text-anchor="middle" fill="#FFFFFF">JS 的调用经 __hostFunction_* 桩直达 Java 方法</text>
    <rect x="60" y="110" width="400" height="32" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2"/>
    <text x="260" y="131" font-size="12.5" text-anchor="middle" fill="#2D2A32">TurboModuleManager.kt:L26-37 / L133-175</text>
  </g>
  <g transform="translate(620,550)">
    <rect x="0" y="0" width="520" height="160" rx="16" fill="#6BCB77" stroke="#2D2A32" stroke-width="4"/>
    <text x="260" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#2D2A32">⑥ 出厂：prefab 预制件</text>
    <text x="260" y="70" font-size="14" text-anchor="middle" fill="#2D2A32">ReactAndroid 以 prefab 形式发布 C++ 头文件与库，</text>
    <text x="260" y="94" font-size="14" text-anchor="middle" fill="#2D2A32">你的 app Gradle 一行 useDefaultReactNative 即取用</text>
    <rect x="60" y="110" width="400" height="32" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="2"/>
    <text x="260" y="131" font-size="12.5" text-anchor="middle" fill="#2D2A32">build.gradle.kts:L523-600（SDK/NDK/ABI）· L644-665（prefab）</text>
  </g>

  <!-- 底注 -->
  <text x="600" y="762" font-size="15" text-anchor="middle" fill="#2D2A32">一句话：Android 侧 = 一扇门 + 一个新链总管 + 一间工厂 + 一条 C++ 地道 + 一批预制件</text>
</svg>
