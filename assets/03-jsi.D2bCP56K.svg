<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="800" fill="#F3EFF9"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#2D2A32" stroke-width="4"/>

  <!-- 标题 -->
  <rect x="60" y="40" width="660" height="70" rx="16" fill="#2D2A32"/>
  <text x="86" y="72" font-size="28" font-weight="bold" fill="#C8B6FF">第三幕 · JSI：穿越次元的门</text>
  <text x="86" y="98" font-size="17" fill="#FFFFFF">左边：旧 Bridge 快递站（停运） 右边：JSI 直达电梯（运营中）</text>

  <!-- 左半：旧 Bridge -->
  <g>
    <rect x="60" y="150" width="520" height="540" rx="20" fill="#FF6B9D" stroke="#2D2A32" stroke-width="4" opacity="0.28"/>
    <rect x="60" y="150" width="520" height="540" rx="20" fill="none" stroke="#2D2A32" stroke-width="4"/>
    <text x="320" y="190" font-size="21" font-weight="bold" text-anchor="middle" fill="#2D2A32">旧 Bridge 快递站（Async JSON）</text>
    <!-- 步骤卡片 -->
    <g font-size="14.5" fill="#2D2A32">
      <rect x="90" y="216" width="200" height="120" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <text x="190" y="246" text-anchor="middle" font-weight="bold">JS 世界</text>
      <text x="190" y="272" text-anchor="middle">把调用打包成 JSON</text>
      <text x="190" y="294" text-anchor="middle">扔进队列</text>
      <text x="190" y="316" text-anchor="middle">然后…等回执</text>
      <rect x="350" y="216" width="200" height="120" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <text x="450" y="246" text-anchor="middle" font-weight="bold">原生世界</text>
      <text x="450" y="272" text-anchor="middle">拆包 → 干活 → 打包</text>
      <text x="450" y="294" text-anchor="middle">结果再寄回 JS</text>
      <text x="450" y="316" text-anchor="middle">一来一回两个包裹</text>
    </g>
    <!-- 卡车 -->
    <g transform="translate(180,370)">
      <rect x="0" y="10" width="86" height="46" rx="8" fill="#FFF9EC" stroke="#2D2A32" stroke-width="3"/>
      <rect x="86" y="24" width="46" height="32" rx="6" fill="#FFD93D" stroke="#2D2A32" stroke-width="3"/>
      <circle cx="26" cy="60" r="11" fill="#2D2A32"/>
      <circle cx="112" cy="60" r="11" fill="#2D2A32"/>
      <text x="43" y="38" font-size="13" text-anchor="middle" fill="#2D2A32">JSON</text>
    </g>
    <text x="320" y="360" font-size="14" text-anchor="middle" fill="#2D2A32">↓ 每次通信都要"打包/拆包" ↓</text>
    <!-- 停运告示 -->
    <g transform="translate(150,470)">
      <rect x="0" y="0" width="340" height="120" rx="14" fill="#2D2A32"/>
      <text x="170" y="38" font-size="19" font-weight="bold" text-anchor="middle" fill="#FF6B9D">停运告示</text>
      <text x="170" y="66" font-size="14" text-anchor="middle" fill="#FFFFFF">异步批处理 + JSON 序列化</text>
      <text x="170" y="90" font-size="14" text-anchor="middle" fill="#FFFFFF">延迟高、丢类型、无法同步调用</text>
    </g>
  </g>

  <!-- 中间对比箭头 -->
  <g transform="translate(596,392)">
    <circle r="26" fill="#2D2A32"/>
    <text y="8" font-size="26" font-weight="bold" text-anchor="middle" fill="#FFD93D">VS</text>
  </g>

  <!-- 右半：JSI -->
  <g>
    <rect x="620" y="150" width="520" height="540" rx="20" fill="#6BCB77" stroke="#2D2A32" stroke-width="4" opacity="0.28"/>
    <rect x="620" y="150" width="520" height="540" rx="20" fill="none" stroke="#2D2A32" stroke-width="4"/>
    <text x="880" y="190" font-size="21" font-weight="bold" text-anchor="middle" fill="#2D2A32">JSI 直达电梯（C++）</text>
    <g font-size="14.5" fill="#2D2A32">
      <rect x="650" y="216" width="220" height="150" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <text x="760" y="246" text-anchor="middle" font-weight="bold">HostObject</text>
      <text x="760" y="272" text-anchor="middle">C++ 对象直接挂在</text>
      <text x="760" y="294" text-anchor="middle">JS 全局对象上</text>
      <text x="760" y="316" text-anchor="middle">get/set 即时调用</text>
      <text x="760" y="342" text-anchor="middle" font-size="13">（jsi.h:L205-L250）</text>
      <rect x="890" y="216" width="220" height="150" rx="12" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <text x="1000" y="246" text-anchor="middle" font-weight="bold">jsi::Runtime</text>
      <text x="1000" y="272" text-anchor="middle">统一接口</text>
      <text x="1000" y="294" text-anchor="middle">Hermes / JSC 谁来都行</text>
      <text x="1000" y="316" text-anchor="middle">属性/对象/字符串/TypedArray</text>
      <text x="1000" y="342" text-anchor="middle" font-size="13">（jsi.h:L704-L822）</text>
    </g>
    <!-- 电梯 -->
    <g transform="translate(800,396)">
      <rect x="0" y="0" width="160" height="110" rx="10" fill="#FFF9EC" stroke="#2D2A32" stroke-width="3"/>
      <line x1="80" y1="0" x2="80" y2="110" stroke="#2D2A32" stroke-width="3"/>
      <text x="40" y="62" font-size="15" text-anchor="middle" fill="#2D2A32">JS</text>
      <text x="120" y="62" font-size="15" text-anchor="middle" fill="#2D2A32">C++</text>
      <path d="M 50 54 L 70 54" stroke="#2D2A32" stroke-width="3" stroke-dasharray="4 4"/>
      <path d="M 90 54 L 110 54" stroke="#2D2A32" stroke-width="3" stroke-dasharray="4 4"/>
      <text x="80" y="132" font-size="14" text-anchor="middle" fill="#2D2A32">不打包 · 不排队 · 可同步</text>
    </g>
    <!-- CallInvoker -->
    <g transform="translate(650,540)">
      <rect x="0" y="0" width="460" height="120" rx="14" fill="#2D2A32"/>
      <text x="230" y="34" font-size="17" font-weight="bold" text-anchor="middle" fill="#6BCB77">CallInvoker：电梯的"调度按钮"</text>
      <text x="230" y="62" font-size="14" text-anchor="middle" fill="#FFFFFF">ReactCommon/callinvoker —— 决定代码</text>
      <text x="230" y="86" font-size="14" text-anchor="middle" fill="#FFFFFF">"在 JS 线程上何时执行"，线程安全全部内建</text>
    </g>
  </g>

  <!-- 底部注 -->
  <text x="600" y="736" font-size="15" text-anchor="middle" fill="#2D2A32">JSI 不是桥，是一份"JS 引擎抽象接口"：任何实现 jsi::Runtime 的引擎（Hermes/JSC）都能与 C++ 直接对话</text>
</svg>
