<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <!-- 背景与边框 -->
  <rect width="1200" height="800" fill="#FFF9EC"/>
  <rect x="14" y="14" width="1172" height="772" rx="26" fill="none" stroke="#2D2A32" stroke-width="4"/>

  <!-- 顶部标题横幅 -->
  <rect x="60" y="40" width="560" height="70" rx="16" fill="#2D2A32"/>
  <text x="86" y="72" font-size="28" font-weight="bold" fill="#FF9F45">第零幕 · 导读</text>
  <text x="86" y="98" font-size="17" fill="#FFFFFF">开学地图 · 三站走完源码之旅</text>

  <!-- 装饰：原子轨道 -->
  <g transform="translate(1060,86)" stroke="#2D2A32" stroke-width="3" fill="none">
    <ellipse rx="52" ry="20" transform="rotate(-20)"/>
    <ellipse rx="52" ry="20" transform="rotate(40)"/>
    <circle r="10" fill="#61DAFB" stroke="#2D2A32" stroke-width="3"/>
  </g>

  <!-- 路径虚线 -->
  <path d="M 250 470 C 380 380, 420 360, 560 360 C 700 360, 760 380, 900 300"
        fill="none" stroke="#2D2A32" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round"/>

  <!-- 第一站：入门村 -->
  <g transform="translate(120,470)">
    <rect x="-10" y="-96" width="280" height="150" rx="18" fill="#6BCB77" stroke="#2D2A32" stroke-width="4"/>
    <text x="14" y="-62" font-size="22" font-weight="bold" fill="#2D2A32">第一站 · 入门村</text>
    <text x="14" y="-32" font-size="16" fill="#2D2A32">漫画 00 导读 · 01 三层世界</text>
    <text x="14" y="-6" font-size="16" fill="#2D2A32">教程 01 环境搭建 · 02 项目结构</text>
    <text x="14" y="20" font-size="16" fill="#2D2A32">教程 03 核心概念</text>
    <!-- 房子 -->
    <g transform="translate(230,-104)" stroke="#2D2A32" stroke-width="3">
      <rect x="-22" y="0" width="44" height="34" fill="#FFF9EC"/>
      <path d="M -30 0 L 0 -24 L 30 0 Z" fill="#FFD93D"/>
      <rect x="-6" y="12" width="12" height="22" fill="#61DAFB"/>
    </g>
  </g>

  <!-- 第二站：进阶镇 -->
  <g transform="translate(440,360)">
    <rect x="-10" y="-96" width="280" height="150" rx="18" fill="#FFD93D" stroke="#2D2A32" stroke-width="4"/>
    <text x="14" y="-62" font-size="22" font-weight="bold" fill="#2D2A32">第二站 · 进阶镇</text>
    <text x="14" y="-32" font-size="16" fill="#2D2A32">漫画 02 启动大戏 · 03 JSI</text>
    <text x="14" y="-6" font-size="16" fill="#2D2A32">教程 04 导航 · 05 状态管理</text>
    <text x="14" y="20" font-size="16" fill="#2D2A32">组件篇 1~5（交互类组件）</text>
    <!-- 旗子 -->
    <g transform="translate(232,-104)" stroke="#2D2A32" stroke-width="3">
      <line x1="0" y1="0" x2="0" y2="40"/>
      <path d="M 0 2 L 30 10 L 0 20 Z" fill="#FF6B9D"/>
    </g>
  </g>

  <!-- 第三站：高阶城 -->
  <g transform="translate(800,300)">
    <rect x="-10" y="-96" width="300" height="150" rx="18" fill="#9B5DE5" stroke="#2D2A32" stroke-width="4"/>
    <text x="14" y="-62" font-size="22" font-weight="bold" fill="#FFF9EC">第三站 · 高阶城</text>
    <text x="14" y="-32" font-size="16" fill="#FFF9EC">漫画 04 TurboModules · 05 Fabric</text>
    <text x="14" y="-6" font-size="16" fill="#FFF9EC">漫画 06~09 双端内幕与全链路</text>
    <text x="14" y="20" font-size="16" fill="#FFF9EC">教程 06 调试 · 组件篇 6~10</text>
    <!-- 城堡 -->
    <g transform="translate(252,-104)" stroke="#2D2A32" stroke-width="3" fill="#FFF9EC">
      <rect x="-24" y="2" width="48" height="32"/>
      <rect x="-30" y="-16" width="12" height="18"/>
      <rect x="18" y="-16" width="12" height="18"/>
    </g>
  </g>

  <!-- 主角：小开发者 -->
  <g transform="translate(520,470)">
    <circle cx="0" cy="-34" r="20" fill="#FFE0BD" stroke="#2D2A32" stroke-width="3"/>
    <path d="M -20 -40 A 20 20 0 0 1 20 -40 L 20 -46 A 20 20 0 0 0 -20 -46 Z" fill="#2D2A32"/>
    <rect x="-16" y="-14" width="32" height="40" rx="10" fill="#61DAFB" stroke="#2D2A32" stroke-width="3"/>
    <rect x="-22" y="24" width="16" height="28" rx="7" fill="#2D2A32"/>
    <rect x="6" y="24" width="16" height="28" rx="7" fill="#2D2A32"/>
    <circle cx="-7" cy="-34" r="2.6" fill="#2D2A32"/>
    <circle cx="7" cy="-34" r="2.6" fill="#2D2A32"/>
    <path d="M -6 -26 Q 0 -21 6 -26" fill="none" stroke="#2D2A32" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <!-- 主角对话气泡 -->
  <g transform="translate(600,392)">
    <rect x="0" y="0" width="230" height="64" rx="14" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
    <path d="M 8 64 L -6 86 L 30 64 Z" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
    <path d="M 9 66 L -3 83 L 27 66 Z" fill="#FFFFFF"/>
    <text x="16" y="28" font-size="16" fill="#2D2A32">源码不可怕，可怕的是</text>
    <text x="16" y="50" font-size="16" fill="#2D2A32">没有地图。跟我出发吧！</text>
  </g>

  <!-- 底部说明 -->
  <rect x="60" y="596" width="1080" height="58" rx="14" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="600" y="632" font-size="18" text-anchor="middle" fill="#2D2A32">全程基于 react-native@0.87.1 官方 npm 源码包 · 每个结论都能在源码里找到行号 · 漫画是路标，源码才是路</text>
</svg>
